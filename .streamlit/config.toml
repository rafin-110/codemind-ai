# Keep Streamlit's upload cap in line with codemind.config.MAX_ZIP_BYTES (20 MB).
[server]
maxUploadSize = 20

[browser]
gatherUsageStats = false

# Deep forest + teal theme (custom styles in ui/components.py use the same palette)
[theme]
base = "light"
primaryColor = "#0D9488"
backgroundColor = "#F5F9F7"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#172B28"
