# Keep Streamlit's upload cap in line with codemind.config.MAX_ZIP_BYTES (20 MB).
[server]
maxUploadSize = 20

[browser]
gatherUsageStats = false

# Red wine and cream theme
[theme]
base = "light"
primaryColor = "#7B1E3A"
backgroundColor = "#FBF5EA"
secondaryBackgroundColor = "#F1E4CF"
textColor = "#3B1420"
